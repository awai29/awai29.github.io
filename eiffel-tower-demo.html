<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './js/vendor/three/OrbitControls.js';
import { cel, flat, hullOutline, Pipeline } from './js/celkit.js';

/* ============================================================== *
 *  Palette. Warmer than the sakura demo on purpose: late-afternoon
 *  Paris rather than blossom season, so the grade pass leans amber
 *  in the lights instead of pink, and the ink leans warm brown-black
 *  rather than violet-black to sit against the tower's iron.
 * ============================================================== */
const PAL = {
  ink: 0x3a2f2a,
  sky: 0xbfd7ee,
  sun: 0xfff0d2,
  fill: 0xaec3e0,
  hemiSky: 0xd9e8f5,
  hemiGround: 0xb9ac97,
  plaza: 0xd9d2c4,
  road: 0xc7bfae,
  park: 0x9db77e,
  parkPath: 0xe0d6bd,
  river: 0x7fa4c2,
  riverDeep: 0x5f84a6,
  bridge: 0xb7ada0,
  iron: 0xcf9a44,
  ironDeep: 0x8a5228,
  ironLit: 0xe6c06a,
  wallCream: 0xf2e6cf,
  wallCreamAlt: 0xecdec2,
  mansard: 0x475266,
  glass: 0x3b4356,
  trunk: 0x6e5644,
  leaf: 0x5f8a52,
  leafDeep: 0x466b3d,
  lampPost: 0x4a4640,
  lampGlow: 0xffd28a,
  beacon: 0xffe6a0,
  flag: 0xb5322f,
  cathedralStone: 0xcac2b0,
  cathedralRoof: 0x2c2a30,
  island: 0xb8ae95,
  islandWall: 0x8f8672,
  awningRed: 0xa8352f,
  awningGreen: 0x3d6b4a,
  awningStripe: 0xf0e6d0,
  tableTop: 0x3a3530,
  bouquiniste: 0x2f5a40,
  bouquinisteLid: 0x3d6e4d,
  hull: 0x264a63,
  hullDeck: 0xe4ddca,
  hullCabin: 0xdfe6ea,
  water: 0x6f97b8,
  arcStone: 0xd8cfba,
  fountainBasin: 0xb9b2a0,
};

/* ============================================================== *
 *  Renderer / scene / camera
 * ============================================================== */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor(new THREE.Color(PAL.sky), 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.sky, 130, 820);

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 1900);
camera.position.set(110, 62, 140);

const controls = new OrbitControls(camera, canvas);
controls.target.set(20, 22, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 25;
controls.maxDistance = 950;
controls.maxPolarAngle = Math.PI * 0.495;

/* two-light "anime" setup: warm quantised key sun, cool bounce fill
 * from the opposite quarter, violet-warm hemisphere so shadow never
 * goes flat black. */
const sun = new THREE.DirectionalLight(PAL.sun, 2.3);
sun.position.set(70, 130, 60);
sun.target.position.set(260, 0, 15); // between the tower and Notre-Dame, so both fall inside the shadow frustum
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -340; sun.shadow.camera.right = 340;
sun.shadow.camera.top = 340; sun.shadow.camera.bottom = -340;
sun.shadow.camera.far = 480;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.24;
scene.add(sun, sun.target);

const fill = new THREE.DirectionalLight(PAL.fill, 1.0);
fill.position.set(60, 40, -50);
scene.add(fill);

const hemi = new THREE.HemisphereLight(PAL.hemiSky, PAL.hemiGround, 1.1);
scene.add(hemi);

const world = new THREE.Group();
scene.add(world);

/* ============================================================== *
 *  Facade texture — Haussmann windows drawn at runtime with
 *  Canvas2D, tiled with RepeatWrapping so one small texture covers
 *  any building footprint. No image assets, same as sakura-crossing.
 * ============================================================== */
function buildFacadeTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f2e6cf';
  ctx.fillRect(0, 0, 64, 64);

  // shutters flanking the window -- the single detail that reads as
  // "Parisian" rather than "generic apartment block" at a glance
  ctx.fillStyle = '#7d6249';
  ctx.fillRect(9, 8, 4, 39);
  ctx.fillRect(51, 8, 4, 39);

  ctx.fillStyle = '#3b4356';
  ctx.fillRect(14, 8, 36, 39);
  ctx.strokeStyle = '#c9bc9c';
  ctx.lineWidth = 2;
  ctx.strokeRect(14, 8, 36, 39);
  ctx.strokeStyle = '#2c3040';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(32, 9); ctx.lineTo(32, 46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, 27); ctx.lineTo(49, 27); ctx.stroke();

  // a wrought-iron balcony ledge under the window
  ctx.fillStyle = '#c9bc9c';
  ctx.fillRect(9, 48, 46, 3);
  ctx.strokeStyle = '#4a4a56';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(9, 45); ctx.lineTo(55, 45); ctx.stroke();
  for (let i = 0; i < 11; i++) {
    const x = 10.5 + i * 4.3;
    ctx.beginPath(); ctx.moveTo(x, 45); ctx.lineTo(x, 48); ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.NearestFilter;
  return tex;
}
const facadeBase = buildFacadeTexture();

/** A flagstone paving texture -- joint lines only, so it reads at any
 * tile scale from a pavement close-up to a plaza seen from the tower. */
function buildPavingTexture(base, joint) {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = joint;
  ctx.fillRect(0, 0, 32, 32);
  ctx.fillStyle = base;
  ctx.fillRect(1, 1, 30, 14);
  ctx.fillRect(1, 17, 14, 14);
  ctx.fillRect(17, 17, 14, 14);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

/** A striped café-awning texture -- colour comes in, stripes go on a
 * pale ground so it reads whether the café is red or green-fronted. */
function buildAwningTexture(color) {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 16;
  const ctx = c.getContext('2d');
  const hex = '#' + new THREE.Color(color).getHexString();
  const stripeHex = '#' + new THREE.Color(PAL.awningStripe).getHexString();
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? hex : stripeHex;
    ctx.fillRect(i * 4, 0, 4, 16);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

/* ============================================================== *
 *  One Haussmann apartment block generator: cream body, canvas
 *  window texture, dark mansard roof. Every building on the streets
 *  around the park and across the river comes from this.
 * ============================================================== */
function haussmann(w, d, h, opts = {}) {
  const { wallColor = PAL.wallCream, seed = 1, cafe = false, cafeFace = 1 } = opts;
  const g = new THREE.Group();

  const tex = facadeBase.clone();
  tex.needsUpdate = true;
  tex.repeat.set(Math.max(1, Math.round(w / 1.6)), Math.max(1, Math.round(h / 1.5)));
  const bodyMat = cel(wallColor, { bands: 3, tint: 0x5a5468, map: tex });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
  body.position.y = h / 2;
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const roofH = h * 0.22;
  const roof = new THREE.Mesh(
    new THREE.CylinderGeometry(Math.max(w, d) * 0.28, Math.max(w, d) * 0.64, roofH, 4),
    cel(PAL.mansard, { bands: 3, tint: 0x2c3040 })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.y = h + roofH / 2;
  roof.castShadow = true;
  g.add(roof);

  // a dormer window on about a third of roofs -- breaks up what would
  // otherwise be a bare pyramid on every single building in the row
  if (seed % 3 === 0) {
    const dormer = new THREE.Group();
    const dormerW = Math.min(w, d) * 0.32;
    const body = new THREE.Mesh(new THREE.BoxGeometry(dormerW, roofH * 0.6, 0.55), cel(PAL.mansard, { bands: 3, tint: 0x2c3040 }));
    dormer.add(body);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(dormerW * 0.75, roofH * 0.42, 4), cel(PAL.mansard, { bands: 2 }));
    cap.rotation.y = Math.PI / 4;
    cap.position.y = roofH * 0.51;
    dormer.add(cap);
    const win = new THREE.Mesh(new THREE.PlaneGeometry(dormerW * 0.55, roofH * 0.32), flat(PAL.glass));
    win.position.set(0, -roofH * 0.02, 0.28);
    dormer.add(win);
    dormer.position.set(0, h + roofH * 0.36, d * 0.28);
    dormer.castShadow = true;
    g.add(dormer);
  }

  // a few chimney pots, cheap seeded variety so a row of ten buildings doesn't repeat identically
  const chimneyCount = 1 + (seed % 3);
  for (let i = 0; i < chimneyCount; i++) {
    const cx = (((seed * 37 + i * 53) % 100) / 100 - 0.5) * w * 0.6;
    const cz = (((seed * 71 + i * 19) % 100) / 100 - 0.5) * d * 0.5;
    const chim = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.1, 0.5), cel(PAL.mansard, { bands: 2 }));
    chim.position.set(cx, h + roofH + 0.55, cz);
    chim.castShadow = true;
    g.add(chim);
  }

  // a street-level café: striped awning over the ground floor, a couple
  // of round tables on the pavement -- the detail that actually makes a
  // frontage read as "a place" rather than just a wall of windows
  if (cafe) {
    const stripeColor = seed % 2 === 0 ? PAL.awningRed : PAL.awningGreen;
    const awningTex = buildAwningTexture(stripeColor);
    const awningMat = cel(0xffffff, { bands: 2, map: awningTex, side: THREE.DoubleSide });
    const awningW = w * 0.92, awningDepth = 1.1;
    const awning = new THREE.Mesh(new THREE.BoxGeometry(awningW, 0.55, awningDepth), awningMat);
    const faceZ = cafeFace * (d / 2 + awningDepth / 2 - 0.05);
    awning.position.set(0, 2.6, faceZ);
    awning.rotation.x = cafeFace > 0 ? -0.18 : 0.18;
    awning.castShadow = true;
    g.add(awning);

    for (let i = 0; i < 3; i++) {
      const tx = (i - 1) * awningW * 0.28;
      const tz = faceZ + cafeFace * 1.5;
      const table = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.06, 10), cel(PAL.tableTop, { bands: 2 }));
      table.position.set(tx, 0.72, tz);
      table.castShadow = true;
      g.add(table);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.7, 6), cel(PAL.lampPost, { bands: 2 }));
      leg.position.set(tx, 0.36, tz);
      g.add(leg);
      for (const cside of [-1, 1]) {
        const chair = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.34), cel(PAL.lampPost, { bands: 2 }));
        chair.position.set(tx + cside * 0.5, 0.28, tz + cafeFace * 0.15);
        g.add(chair);
      }
    }
  }
  return g;
}

/* a Belle-Époque candelabra lamp post: a fluted pole, a base collar,
 * three globes on curved arms plus one on top -- only the top globe
 * actually casts light, the rest are decoration so a park full of
 * these doesn't multiply the light count the renderer has to shade. */
function lamp(x, z) {
  const g = new THREE.Group();
  const postMat = cel(PAL.lampPost, { bands: 2 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.22, 8), postMat);
  base.position.y = 0.11;
  g.add(base);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.09, 2.85, 8), postMat);
  pole.position.y = 1.53;
  pole.castShadow = true;
  g.add(pole);
  const collar = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), postMat);
  collar.position.y = 2.95;
  g.add(collar);
  for (const side of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.42, 6), postMat);
    arm.position.set(side * 0.18, 3.08, 0);
    arm.rotation.z = side * 1.0;
    g.add(arm);
    const globe = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), flat(PAL.lampGlow));
    globe.position.set(side * 0.36, 3.22, 0);
    g.add(globe);
  }
  const topGlobe = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), flat(PAL.lampGlow));
  topGlobe.position.y = 3.45;
  g.add(topGlobe);
  const glow = new THREE.PointLight(PAL.lampGlow, 0.55, 4, 2);
  glow.position.y = 3.45;
  g.add(glow);
  g.position.set(x, 0, z);
  world.add(g);
  return g;
}

/* a park bench, seat-plank + iron ends -- placed along the central path */
function bench(x, z, rotY = 0) {
  const g = new THREE.Group();
  const woodMat = cel(PAL.trunk, { bands: 2, tint: 0x4a3a2c });
  const ironMat = cel(PAL.lampPost, { bands: 2 });
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.07, 0.5), woodMat);
  seat.position.y = 0.46;
  seat.castShadow = seat.receiveShadow = true;
  g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.5, 0.07), woodMat);
  back.position.set(0, 0.72, -0.22);
  back.castShadow = true;
  g.add(back);
  for (const side of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.46, 0.46), ironMat);
    leg.position.set(side * 0.75, 0.23, 0);
    leg.castShadow = true;
    g.add(leg);
  }
  g.rotation.y = rotY;
  g.position.set(x, 0, z);
  world.add(g);
  return g;
}

/* a park tree: trunk + a few icosahedron canopy blobs, high-key so
 * the shadow side stays readable rather than going a dark green lump */
function tree(x, z, scale = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * scale, 0.24 * scale, 2.2 * scale, 7), cel(PAL.trunk, { bands: 3 }));
  trunk.position.y = 1.1 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  const canopyMat = cel(PAL.leaf, { bands: 3, tint: 0x3d5a48 });
  [[0, 0.55, 0, 1.0], [0.55, 0.25, 0.3, 0.68], [-0.5, 0.3, -0.28, 0.72], [0.15, 0.75, -0.4, 0.6]].forEach(([dx, dy, dz, s]) => {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05 * s * scale, 1), canopyMat);
    blob.position.set(dx * scale, (2.1 + dy) * scale, dz * scale);
    blob.castShadow = true;
    g.add(blob);
  });
  g.position.set(x, 0, z);
  world.add(g);
  return g;
}

/* ============================================================== *
 *  Ground: plaza base, the park (Champ de Mars, south of the
 *  tower), a path down its centre, and the Seine -- now a long
 *  band running the width of the whole city, wide enough to carry
 *  an island for Notre-Dame further downstream.
 * ============================================================== */
const plazaPaving = buildPavingTexture('#d9d2c4', '#c7bfae');
plazaPaving.repeat.set(800, 460);
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(2000, 1150), cel(0xffffff, { bands: 2, tint: 0x8f8878, map: plazaPaving }));
plaza.rotation.x = -Math.PI / 2;
plaza.position.set(100, 0, -40);
plaza.receiveShadow = true;
world.add(plaza);

const PARK_Z0 = -12, PARK_Z1 = -340, PARK_HALF_W = 44;
const park = new THREE.Mesh(new THREE.PlaneGeometry(PARK_HALF_W * 2, Math.abs(PARK_Z1 - PARK_Z0)), cel(PAL.park, { bands: 3, tint: 0x3d5a48 }));
park.rotation.x = -Math.PI / 2;
park.position.set(0, 0.01, (PARK_Z0 + PARK_Z1) / 2);
park.receiveShadow = true;
world.add(park);

const pathLen = Math.abs(PARK_Z1 - PARK_Z0) - 4;
const pathPaving = buildPavingTexture('#e0d6bd', '#cfc2a0');
pathPaving.repeat.set(4, Math.round(pathLen / 2.2));
const path = new THREE.Mesh(new THREE.PlaneGeometry(5, pathLen), cel(0xffffff, { bands: 2, map: pathPaving }));
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.02, (PARK_Z0 + PARK_Z1) / 2);
path.receiveShadow = true;
world.add(path);

/* benches along the central path, alternating sides with the lamps */
for (let i = 0; i < 15; i++) {
  const z = PARK_Z0 - 14 - i * 20;
  bench(-5.4, z, Math.PI / 2);
  bench(5.4, z, -Math.PI / 2);
}

const RIVER_Z = 22, RIVER_HALF_W = 30, RIVER_X0 = -420, RIVER_X1 = 620;
const riverLen = RIVER_X1 - RIVER_X0;
const river = new THREE.Mesh(new THREE.PlaneGeometry(riverLen, RIVER_HALF_W * 2), cel(PAL.river, { bands: 2, tint: 0x33506b }));
river.rotation.x = -Math.PI / 2;
river.position.set((RIVER_X0 + RIVER_X1) / 2, 0.005, RIVER_Z);
river.receiveShadow = true;
world.add(river);
const riverBand = new THREE.Mesh(new THREE.PlaneGeometry(riverLen, RIVER_HALF_W * 0.7), cel(PAL.riverDeep, { bands: 2, tint: 0x213c53 }));
riverBand.rotation.x = -Math.PI / 2;
riverBand.position.set((RIVER_X0 + RIVER_X1) / 2, 0.006, RIVER_Z);
world.add(riverBand);

/** A quay bridge deck across the full river band, piers included --
 * used for Pont d'Iéna at the tower and again at the island. */
function quayBridge(x, deckW) {
  const bridgeDeck = new THREE.Mesh(new THREE.BoxGeometry(deckW, 0.6, RIVER_HALF_W * 2 + 6), cel(PAL.bridge, { bands: 2 }));
  bridgeDeck.position.set(x, 0.5, RIVER_Z);
  bridgeDeck.castShadow = bridgeDeck.receiveShadow = true;
  world.add(bridgeDeck);
  for (const side of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, RIVER_HALF_W * 2 + 6), cel(PAL.ironDeep, { bands: 2 }));
    rail.position.set(x + side * deckW / 2 - side * 0.1, 1.1, RIVER_Z);
    rail.castShadow = true;
    world.add(rail);
  }
  for (let i = -1; i <= 1; i++) {
    const pier = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 4, 8), cel(PAL.bridge, { bands: 3 }));
    pier.position.set(x, -1.4, RIVER_Z + i * RIVER_HALF_W);
    pier.castShadow = pier.receiveShadow = true;
    world.add(pier);
  }
}
quayBridge(0, 9); // Pont d'Iéna, right in front of the tower

/* ============================================================== *
 *  Streets: two-deep blocks of Haussmann buildings either side of
 *  the park (a real street grid rather than a single facing row),
 *  plus the Trocadéro side across the river, and a hazy skyline
 *  ring far beyond the walkable city so the scene reads as a much
 *  bigger place than what's actually modelled underfoot.
 * ============================================================== */
const seed = (s => () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff)(11);
function buildRow(x, z0, z1, faceX, count, jitter = 1.2, cafeChance = 0) {
  const span = (z1 - z0) / count;
  for (let i = 0; i < count; i++) {
    const w = 6 + seed() * 2.5;
    const d = 8 + seed() * 3;
    const h = 6.5 + seed() * 3.5;
    const wall = seed() > 0.5 ? PAL.wallCream : PAL.wallCreamAlt;
    const isCafe = seed() < cafeChance;
    const b = haussmann(w, d, h, { wallColor: wall, seed: Math.floor(seed() * 90), cafe: isCafe });
    b.position.set(x + (seed() - 0.5) * jitter, 0, z0 + span * (i + 0.5));
    b.rotation.y = faceX > 0 ? -Math.PI / 2 : Math.PI / 2;
    world.add(b);
  }
}
// four ranks of blocks per side, each rank its own service street --
// the innermost rank, facing the park, gets a chance of a café frontage

buildRow(-(PARK_HALF_W + 68), PARK_Z0 - 4, PARK_Z1 + 4, -1, 30);
buildRow(PARK_HALF_W + 8, PARK_Z0 - 4, PARK_Z1 + 4, 1, 34, 1.2, 0.22);
buildRow(PARK_HALF_W + 28, PARK_Z0 - 4, PARK_Z1 + 4, 1, 34);
buildRow(PARK_HALF_W + 48, PARK_Z0 - 4, PARK_Z1 + 4, 1, 32);
buildRow(PARK_HALF_W + 68, PARK_Z0 - 4, PARK_Z1 + 4, 1, 30);

/** A run of buildings along a fixed Z line (a riverbank street). */
function buildBank(x0, x1, z, count, depthJitter = 2) {
  const span = (x1 - x0) / count;
  for (let i = 0; i < count; i++) {
    const b = haussmann(7 + seed() * 2.5, 9 + seed() * 2, 7 + seed() * 4, {
      wallColor: seed() > 0.5 ? PAL.wallCream : PAL.wallCreamAlt, seed: i + 5,
    });
    b.position.set(x0 + span * (i + 0.5) + (seed() - 0.5) * 3, 0, z + (seed() - 0.5) * depthJitter);
    world.add(b);
  }
}

/* ============================================================== *
 *  A fountain partway down the park, and the Arc de Triomphe
 *  closing the vista at its far (south) end -- the second landmark,
 *  and a different kind of arch to Notre-Dame's pointed gothic one:
 *  a single round-headed opening through a plain stone block.
 * ============================================================== */
function buildFountain(x, z, radius) {
  const g = new THREE.Group();
  const basin = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.05, 0.6, 20), cel(PAL.fountainBasin, { bands: 3 }));
  basin.position.y = 0.3;
  basin.castShadow = basin.receiveShadow = true;
  g.add(basin);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.88, radius * 0.88, 0.1, 20), cel(PAL.water, { bands: 2, tint: 0x2f4d63 }));
  water.position.y = 0.56;
  g.add(water);
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.6, 10), cel(PAL.fountainBasin, { bands: 3 }));
  pedestal.position.y = 1.4;
  pedestal.castShadow = true;
  g.add(pedestal);
  const jet = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1.3, 8), flat(0xdcecf5, { transparent: true, opacity: 0.6 }));
  jet.position.y = 2.75;
  g.add(jet);
  g.position.set(x, 0, z);
  world.add(g);
  return g;
}
buildFountain(0, PARK_Z1 + 46, 4.2);

function buildArcDeTriomphe(x, z) {
  const g = new THREE.Group();
  const halfW = 15, height = 24, depthD = 9;
  const outer = new THREE.Shape();
  outer.moveTo(-halfW, 0);
  outer.lineTo(halfW, 0);
  outer.lineTo(halfW, height);
  outer.lineTo(-halfW, height);
  outer.closePath();

  const archHalfW = halfW * 0.4, springY = height * 0.42, archTop = height * 0.82;
  const hole = new THREE.Path();
  hole.moveTo(-archHalfW, 0);
  hole.lineTo(-archHalfW, springY);
  hole.quadraticCurveTo(-archHalfW, archTop, 0, archTop);
  hole.quadraticCurveTo(archHalfW, archTop, archHalfW, springY);
  hole.lineTo(archHalfW, 0);
  hole.closePath();
  outer.holes.push(hole);

  const stoneMat = cel(PAL.arcStone, { bands: 3, tint: 0x5a5468 });
  const bodyGeo = new THREE.ExtrudeGeometry(outer, { depth: depthD, bevelEnabled: false });
  bodyGeo.translate(0, 0, -depthD / 2);
  const body = new THREE.Mesh(bodyGeo, stoneMat);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const cornice = new THREE.Mesh(new THREE.BoxGeometry(halfW * 2 + 1, 1.3, depthD + 1), stoneMat);
  cornice.position.y = height + 0.65;
  cornice.castShadow = true;
  g.add(cornice);

  // shallow relief panels either side of the arch, just enough incident
  // shadow to read as sculpture rather than a blank face
  [-1, 1].forEach((side) => {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(halfW * 0.7, height * 0.62, 0.3), cel(PAL.arcStone, { bands: 3, tint: 0x4a4458 }));
    panel.position.set(side * halfW * 0.62, height * 0.42, depthD / 2 + 0.02);
    panel.castShadow = true;
    g.add(panel);
  });

  g.position.set(x, 0, z);
  world.add(g);
  return g;
}
buildArcDeTriomphe(0, PARK_Z1 - 16);

/* ============================================================== *
 *  Bouquiniste stalls along both quais, and a handful of boats
 *  gliding down the Seine -- the two details that make the river
 *  read as used rather than just a blue strip on the ground.
 * ============================================================== */
function bouquiniste(x, z, faceSign) {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 1.1), cel(PAL.bouquiniste, { bands: 2 }));
  box.position.y = 0.75;
  box.castShadow = box.receiveShadow = true;
  g.add(box);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(3.35, 0.12, 1.25), cel(PAL.bouquinisteLid, { bands: 2 }));
  lid.position.set(0, 1.22, faceSign * -0.12);
  lid.rotation.x = faceSign * 0.16;
  lid.castShadow = true;
  g.add(lid);
  g.position.set(x, 0, z);
  world.add(g);
  return g;
}
for (let x = -150; x <= 350; x += 17) {

  bouquiniste(x + (seed() - 0.5) * 3, RIVER_Z + RIVER_HALF_W - 1.2, 1);

function buildBoat(len) {
  const g = new THREE.Group();
  const beam = len * 0.26, draft = 0.9, half = beam / 2;
  const hullMat = cel(PAL.hull, { bands: 3, tint: 0x24405a });

  // hull footprint in the shape's XY plane (X = beam, Y = length, pointed
  // bow at +Y), extruded vertically for the draft -- one watertight shape
  // rather than a box with separate bow/stern pieces glued on.
  const shape = new THREE.Shape();
  shape.moveTo(0, len / 2);
  shape.quadraticCurveTo(half, len / 2 - len * 0.18, half, len * 0.16);
  shape.lineTo(half, -len / 2 + len * 0.1);
  shape.quadraticCurveTo(half, -len / 2, 0, -len / 2);
  shape.quadraticCurveTo(-half, -len / 2, -half, -len / 2 + len * 0.1);
  shape.lineTo(-half, len * 0.16);
  shape.quadraticCurveTo(-half, len / 2 - len * 0.18, 0, len / 2);
  shape.closePath();
  const hullGeo = new THREE.ExtrudeGeometry(shape, { depth: draft, bevelEnabled: false });
  hullGeo.rotateX(-Math.PI / 2); // shape Y (length) -> -Z, extrude depth (draft) -> Y
  hullGeo.rotateY(Math.PI);      // bow ends up at +Z instead of -Z
  const hull = new THREE.Mesh(hullGeo, hullMat);
  hull.castShadow = hull.receiveShadow = true;
  g.add(hull);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(beam * 0.94, 0.5, len * 0.68), cel(PAL.hullDeck, { bands: 2 }));
  deck.position.y = draft + 0.25;
  deck.castShadow = deck.receiveShadow = true;
  g.add(deck);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(beam * 0.8, 0.5, len * 0.5), cel(PAL.hullCabin, { bands: 2, tint: 0x5a6068 }));
  cabin.position.y = draft + 0.75;
  cabin.castShadow = true;
  g.add(cabin);

  return g;
}
const boats = [];
for (let i = 0; i < 5; i++) {
  const len = 10 + seed() * 5;
  const boat = buildBoat(len);
  const lane = i % 2 === 0 ? -1 : 1;
  boat.position.set(RIVER_X0 + 40 + i * ((RIVER_X1 - RIVER_X0 - 80) / 5), 0, RIVER_Z + lane * RIVER_HALF_W * 0.45);
  boat.rotation.y = lane > 0 ? Math.PI : 0; // lanes run opposite ways, like real river traffic
  world.add(boat);
  boats.push({ mesh: boat, speed: 1.4 + seed() * 0.8, dir: lane > 0 ? -1 : 1 });
}

/* ============================================================== *
 *  Distant skyline -- a ring of hazy, unlit silhouette blocks well
 *  past the walkable city, blended into the fog. Cheap (one flat
 *  material, no shadows) and does most of the work of making the
 *  place feel like a real city rather than a diorama.
 * ============================================================== */
function buildSkyline() {
  const skylineMat = flat(0xaeb9c4, { transparent: true, opacity: 0.75 });
  const g = new THREE.Group();
  const ranges = [
    { x0: -420, x1: 620, z: 380, count: 100 },   // far north, beyond Trocadéro
    { x0: -420, x1: -280, z: 60, count: 12 },    // west edge, beyond the far bank row
    { x0: 580, x1: 650, z: 80, count: 14 },      // east, past Notre-Dame
    { x0: -110, x1: 110, z: -420, count: 26 },   // south, beyond Champ de Mars
  ];
  for (const r of ranges) {
    const span = (r.x1 - r.x0) / r.count;
    for (let i = 0; i < r.count; i++) {
      const w = span * (0.55 + seed() * 0.4);
      const h = 5 + seed() * 16;
      const blk = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), skylineMat);
      blk.position.set(r.x0 + span * (i + 0.5), h / 2, r.z + (seed() - 0.5) * 10);
      g.add(blk);
    }
  }
  world.add(g);
}
buildSkyline();

/* ============================================================== *
 *  The tower.
 *
 *  Four tapered legs (square-section cylinders, radial=4) run from
 *  the ground corners to the first platform, narrow further to the
 *  second, then narrow again to a point above it -- open latticework
 *  the whole way up, never a solid mass. A lattice texture (Canvas2D,
 *  tiled) stands in for the ironwork on every leg face,
 *  and four flattened half-torus arches at the base carry the one
 *  silhouette detail that actually reads "Eiffel Tower" from a
 *  distance -- everything else here is a stylised, low-poly reading
 *  of the real structure's proportions, not a scale model.
 * ============================================================== */
function buildLatticeTexture() {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 64;
  const ctx = c.getContext('2d');
  // white ground -- the map multiplies against the material's own gold
  // colour, so painting the ground gold here too would double it up and
  // darken the whole tower, which is what made the first pass read muddy
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 32, 64);
  ctx.strokeStyle = '#5a3a1e';
  ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(32, 32);
  ctx.moveTo(32, 0); ctx.lineTo(0, 32);
  ctx.moveTo(0, 32); ctx.lineTo(32, 64);
  ctx.moveTo(32, 32); ctx.lineTo(0, 64);
  ctx.stroke();
  // a riveted-panel border frame, echoing the reference model's ironwork edges
  ctx.strokeStyle = '#7a5228';
  ctx.lineWidth = 1.6;
  ctx.strokeRect(1, 1, 30, 62);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const latticeTex = buildLatticeTexture();
function latticeMat(bands = 3) {
  const t = latticeTex.clone();
  t.needsUpdate = true;
  return cel(PAL.iron, { bands, tint: 0x6a4222, map: t });
}

/** A small arcaded frieze -- the row of rounded arches under the
 * reference model's first platform, which is most of what was missing. */
function buildArcadeTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 16;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 64, 16);
  ctx.fillStyle = '#4a2e18';
  for (let i = 0; i < 8; i++) {
    const x = i * 8;
    ctx.beginPath();
    ctx.arc(x + 4, 7, 2.8, Math.PI, 0);
    ctx.lineTo(x + 6.8, 15);
    ctx.lineTo(x + 1.2, 15);
    ctx.closePath();
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}
const arcadeTex = buildArcadeTexture();
function arcadeMat(repeatX) {
  const t = arcadeTex.clone();
  t.needsUpdate = true;
  t.repeat.set(repeatX, 1);
  return cel(PAL.ironDeep, { bands: 3, tint: 0x4a2e18, map: t });
}

function legSegment(bottom, top, rBottom, rTop, material, radialSegments = 4, texRepeat = 3) {
  const dir = new THREE.Vector3().subVectors(top, bottom);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(rTop, rBottom, len, radialSegments, 1);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * texRepeat);
  uv.needsUpdate = true;
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.copy(bottom).add(top).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

/**
 * A leg as a bowed curve rather than a straight taper -- a quadratic
 * bezier through a control point pushed outward (away from the tower's
 * central axis) so the leg reads as concave, the way the real legs do,
 * instead of a plain cone. Straight-line legs were the biggest reason
 * the first pass didn't read as the Eiffel Tower from a distance.
 */
function curvedLeg(p0, p1, r0, r1, bowOut, segments, material, texRepeatTotal) {
  const mid = p0.clone().lerp(p1, 0.5);
  const outDir = new THREE.Vector3(mid.x, 0, mid.z).normalize();
  const control = mid.clone().addScaledVector(outDir, bowOut);
  const curve = new THREE.QuadraticBezierCurve3(p0, control, p1);
  const pts = curve.getPoints(segments);
  const group = new THREE.Group();
  for (let i = 0; i < segments; i++) {
    const ta = i / segments, tb = (i + 1) / segments;
    const ra = THREE.MathUtils.lerp(r0, r1, ta);
    const rb = THREE.MathUtils.lerp(r0, r1, tb);
    group.add(legSegment(pts[i], pts[i + 1], ra, rb, material, 4, texRepeatTotal / segments));
  }
  return group;
}

function baseArch(p1, p2, tube, heightScale, material) {
  const span = p1.distanceTo(p2);
  const geo = new THREE.TorusGeometry(span / 2, tube, 6, 28, Math.PI);
  const mesh = new THREE.Mesh(geo, material);
  mesh.scale.y = heightScale;
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

function buildEiffelTower() {
  const g = new THREE.Group();

  const B0 = 9.0;   // half-width of the ground footprint
  const H1 = 15;    // first platform height
  const B1 = 4.4;   // half-width at the first platform
  const H2 = 25.5;  // second platform height
  const B2 = 1.9;   // half-width at the second platform
  const H3 = 36.5;  // where the four legs converge to a point
  const H3B = 38.2; // top of the small collar at that apex
  const H4A = 43.5; // top of the thin spire cone
  const H4 = 45.5;  // antenna tip

  const corners0 = [[B0, B0], [B0, -B0], [-B0, B0], [-B0, -B0]];
  const corners1 = [[B1, B1], [B1, -B1], [-B1, B1], [-B1, -B1]];
  const corners2 = [[B2, B2], [B2, -B2], [-B2, B2], [-B2, -B2]];

  const legMat = latticeMat(3);
  const legs0 = corners0.map(([x, z]) => new THREE.Vector3(x, 0, z));
  const legs1 = corners1.map(([x, z]) => new THREE.Vector3(x, H1, z));
  const legs2 = corners2.map(([x, z]) => new THREE.Vector3(x, H2, z));

  legs0.forEach((p0, i) => g.add(curvedLeg(p0, legs1[i], 1.65, 0.72, 2.6, 4, legMat, 4)));
  legs1.forEach((p1, i) => g.add(curvedLeg(p1, legs2[i], 0.72, 0.38, 0.6, 2, legMat, 3)));

  // the four base arches -- the one silhouette detail everything else rides on
  const archMat = latticeMat(4);
  g.add(baseArch(legs0[0], legs0[1], 0.42, 1.35, archMat)); // +X face
  g.add(baseArch(legs0[2], legs0[3], 0.42, 1.35, archMat)); // -X face
  g.add(baseArch(legs0[0], legs0[2], 0.42, 1.35, archMat)); // +Z face
  g.add(baseArch(legs0[1], legs0[3], 0.42, 1.35, archMat)); // -Z face

  // two viewing platforms
  const deckMat = cel(PAL.ironLit, { bands: 3, tint: 0x7a5030 });
  const deck1 = new THREE.Mesh(new THREE.BoxGeometry(B1 * 2 + 1.4, 1.1, B1 * 2 + 1.4), deckMat);
  deck1.position.set(0, H1, 0);
  deck1.castShadow = deck1.receiveShadow = true;
  g.add(deck1);
  const deck2 = new THREE.Mesh(new THREE.BoxGeometry(B2 * 2 + 1.0, 0.9, B2 * 2 + 1.0), deckMat);
  deck2.position.set(0, H2, 0);
  deck2.castShadow = deck2.receiveShadow = true;
  g.add(deck2);

  // the arcaded frieze under the first platform -- the reference model's
  // most distinctive detail and the thing our first pass skipped entirely
  const arcade = new THREE.Mesh(new THREE.BoxGeometry(B1 * 2 + 1.2, 1.15, B1 * 2 + 1.2), arcadeMat(10));
  arcade.position.set(0, H1 - 1.35, 0);
  arcade.castShadow = arcade.receiveShadow = true;
  g.add(arcade);

  // cross braces under the first platform -- a hint of the trellis
  // between the arches and the deck, kept to one tier for draw-call cost
  const braceMat = latticeMat(3);
  for (let i = 0; i < corners1.length; i++) {
    for (let j = i + 1; j < corners1.length; j++) {
      const a = legs1[i], b = legs1[j];
      if (a.distanceTo(b) > B1 * 2.2) continue; // skip the two diagonals, keep the four edges
      const brace = legSegment(a.clone().setY(H1 - 0.6), b.clone().setY(H1 - 0.6), 0.22, 0.22, braceMat, 4, 1);
      g.add(brace);
    }
  }

  // above the second platform the real tower is still open latticework,
  // not a solid mass -- four thin legs converging to a point, the same
  // construction as the lower tiers, is what actually reads as "Eiffel
  // Tower" here; a single fat cone just reads as a witch's hat.
  const apex = new THREE.Vector3(0, H3, 0);
  const topLegMat = latticeMat(3);
  legs2.forEach((p2, i) => g.add(curvedLeg(p2, apex, 0.5, 0.09, 0.3, 2, topLegMat, 2)));

  const collarMat = cel(PAL.ironLit, { bands: 3, tint: 0x7a5030 });
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.4, H3B - H3, 8), collarMat);
  collar.position.set(0, (H3 + H3B) / 2, 0);
  collar.castShadow = collar.receiveShadow = true;
  g.add(collar);

  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.42, H4A - H3B, 8), cel(PAL.ironDeep, { bands: 3 }));
  spire.position.set(0, (H3B + H4A) / 2, 0);
  spire.castShadow = true;
  g.add(spire);

  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, H4 - H4A, 6), cel(PAL.ironDeep, { bands: 2 }));
  antenna.position.set(0, (H4A + H4) / 2, 0);
  antenna.castShadow = true;
  g.add(antenna);

  const beaconMat = flat(PAL.beacon);
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), beaconMat);
  beacon.position.set(0, H4, 0);
  g.add(beacon);
  const beaconLight = new THREE.PointLight(PAL.beacon, 1.2, 20, 2);
  beaconLight.position.set(0, H4, 0);
  g.add(beaconLight);

  // a small tricolour on the first platform for a dash of saturated colour
  const poleH = 2.4;
  const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, poleH, 5), cel(PAL.ironDeep, { bands: 2 }));
  flagPole.position.set(0, H1 + 0.55 + poleH / 2, 0);
  g.add(flagPole);
  const flagCloth = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.6), flat(PAL.flag, { side: THREE.DoubleSide }));
  flagCloth.position.set(0.5, H1 + 0.55 + poleH - 0.35, 0);
  g.add(flagCloth);

  return { group: g, spire, deck1, deck2, beacon, beaconLight };
}

const tower = buildEiffelTower();
world.add(tower.group);
const towerSpireShell = hullOutline(tower.spire, 0.05, PAL.ink);
const deck1Shell = hullOutline(tower.deck1, 0.035, PAL.ink);
const deck2Shell = hullOutline(tower.deck2, 0.045, PAL.ink);

/* ============================================================== *
 *  Notre-Dame, downstream on an island in the Seine.
 *
 *  Built in a local frame where the facade faces local -Z and the
 *  nave runs along local +Z (an ordinary "building" convention),
 *  then the whole group is yawed 90 deg so the facade ends up
 *  facing west, back toward the tower, with the nave running east
 *  into the island -- the same layout as the real Ile de la Cite.
 *
 *  The two identifying details that matter more than any amount of
 *  Gothic ornament: the towers are flat-topped (no spires on them,
 *  unlike most cathedrals), and the flèche over the crossing is
 *  taller than either tower.
 * ============================================================== */
function buildGothicTexture() {
  const c = document.createElement('canvas');
  c.width = 48; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#cac2b0';
  ctx.fillRect(0, 0, 48, 96);
  ctx.fillStyle = '#4a4a56';
  ctx.beginPath();
  ctx.moveTo(14, 72);
  ctx.lineTo(14, 42);
  ctx.quadraticCurveTo(14, 20, 24, 13);
  ctx.quadraticCurveTo(34, 20, 34, 42);
  ctx.lineTo(34, 72);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#a49c88';
  ctx.lineWidth = 2;
  ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const gothicTex = buildGothicTexture();
function gothicMat(repeatX, repeatY, bands = 3) {
  const t = gothicTex.clone();
  t.needsUpdate = true;
  t.repeat.set(repeatX, repeatY);
  return cel(PAL.cathedralStone, { bands, tint: 0x565068, map: t });
}

function buildRoseTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a2f2a';
  ctx.beginPath(); ctx.arc(64, 64, 62, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e8b04a';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(64, 64, 58, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(64, 64);
    ctx.lineTo(64 + Math.cos(a) * 58, 64 + Math.sin(a) * 58);
    ctx.stroke();
  }
  ctx.fillStyle = '#f0c86a';
  ctx.beginPath(); ctx.arc(64, 64, 15, 0, Math.PI * 2); ctx.fill();
  return new THREE.CanvasTexture(c);
}

/** A triangular-prism gable roof, apex up, spanning local X, running
 * along local Z -- built as a straight extrude so there's no rotation
 * math to get wrong, unlike a tilted-box approach. */
function gableRoof(halfSpanX, riseY, lenZ, material) {
  const shape = new THREE.Shape();
  shape.moveTo(-halfSpanX, 0);
  shape.lineTo(0, riseY);
  shape.lineTo(halfSpanX, 0);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: lenZ, bevelEnabled: false });
  geo.translate(0, 0, -lenZ / 2);
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

function buildNotreDame() {
  const g = new THREE.Group();

  const FACADE_W = 22, FACADE_D = 6, FACADE_H = 20;
  const TOWER_W = 6.5, TOWER_H = 28;
  const NAVE_LEN = 46, NAVE_HALF_W = 8, NAVE_WALL_H = 15, ROOF_RISE = 8;

  const facade = new THREE.Mesh(new THREE.BoxGeometry(FACADE_W, FACADE_H, FACADE_D), gothicMat(5, 4));
  facade.position.set(0, FACADE_H / 2, 0);
  facade.castShadow = facade.receiveShadow = true;
  g.add(facade);

  const roofMat = cel(PAL.cathedralRoof, { bands: 3, tint: 0x1c1a20 });
  [-1, 1].forEach((side) => {
    const tower = new THREE.Mesh(new THREE.BoxGeometry(TOWER_W, TOWER_H, TOWER_W), gothicMat(3, 6));
    tower.position.set(side * (FACADE_W / 2 - TOWER_W / 2), TOWER_H / 2, 0);
    tower.castShadow = tower.receiveShadow = true;
    g.add(tower);
    // a flat parapet cap -- no spire on the towers is what actually reads as Notre-Dame
    const cap = new THREE.Mesh(new THREE.BoxGeometry(TOWER_W + 0.5, 0.7, TOWER_W + 0.5), roofMat);
    cap.position.set(side * (FACADE_W / 2 - TOWER_W / 2), TOWER_H + 0.35, 0);
    g.add(cap);
  });

  const rose = new THREE.Mesh(new THREE.CircleGeometry(3.1, 24), flat(0xffffff, { map: buildRoseTexture() }));
  rose.rotation.y = Math.PI;
  rose.position.set(0, 13.4, -FACADE_D / 2 - 0.05);
  g.add(rose);

  const portalShape = new THREE.Shape();
  portalShape.moveTo(-1.6, 0);
  portalShape.lineTo(-1.6, 3.2);
  portalShape.quadraticCurveTo(-1.6, 5.6, 0, 6.4);
  portalShape.quadraticCurveTo(1.6, 5.6, 1.6, 3.2);
  portalShape.lineTo(1.6, 0);
  portalShape.closePath();
  const portal = new THREE.Mesh(new THREE.ExtrudeGeometry(portalShape, { depth: 0.35, bevelEnabled: false }), roofMat);
  portal.rotation.y = Math.PI;
  portal.position.set(0, 0.05, -FACADE_D / 2 - 0.02);
  g.add(portal);

  const naveBody = new THREE.Mesh(new THREE.BoxGeometry(NAVE_HALF_W * 2, NAVE_WALL_H, NAVE_LEN), gothicMat(4, 3));
  naveBody.position.set(0, NAVE_WALL_H / 2, FACADE_D / 2 + NAVE_LEN / 2);
  naveBody.castShadow = naveBody.receiveShadow = true;
  g.add(naveBody);

  const roof = gableRoof(NAVE_HALF_W, ROOF_RISE, NAVE_LEN, roofMat);
  roof.position.set(0, NAVE_WALL_H, FACADE_D / 2 + NAVE_LEN / 2);
  g.add(roof);

  // the flèche, over the crossing about a third of the way down the nave --
  // taller than the towers, which is the other half of reading as Notre-Dame
  const spireBaseY = NAVE_WALL_H + ROOF_RISE;
  const spireZ = FACADE_D / 2 + NAVE_LEN * 0.35;
  const spire = legSegment(
    new THREE.Vector3(0, spireBaseY, spireZ), new THREE.Vector3(0, spireBaseY + 12, spireZ),
    1.3, 0.12, roofMat, 4, 3
  );
  g.add(spire);
  const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.4, 0.14), roofMat);
  crossV.position.set(0, spireBaseY + 12.7, spireZ);
  g.add(crossV);
  const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.14, 0.14), roofMat);
  crossH.position.set(0, spireBaseY + 12.9, spireZ);
  g.add(crossH);

  // flying buttresses -- a hint of the rhythm along both sides of the nave
  const buttressMat = gothicMat(1, 1, 3);
  const buttressCount = 5;
  for (let i = 0; i < buttressCount; i++) {
    const z = FACADE_D / 2 + 5 + (i * (NAVE_LEN - 10)) / (buttressCount - 1);
    [-1, 1].forEach((side) => {
      const pier = new THREE.Vector3(side * (NAVE_HALF_W + 3.2), 4.5, z);
      const wallPt = new THREE.Vector3(side * NAVE_HALF_W, NAVE_WALL_H - 1.5, z);
      g.add(legSegment(pier, wallPt, 0.32, 0.24, buttressMat, 4, 1));
      const pierBase = new THREE.Mesh(new THREE.BoxGeometry(0.7, 4.5, 0.7), buttressMat);
      pierBase.position.set(pier.x, 2.25, z);
      pierBase.castShadow = true;
      g.add(pierBase);
    });
  }

  return { group: g, spire };
}

/* The island (Ile de la Cite stand-in) that carries Notre-Dame --
 * built the same way sakura-crossing's lake sits above its terrain:
 * a flat platform raised just above the water surface, so the river
 * plane underneath simply disappears where the island covers it. */
const ISLAND_X0 = 460, ISLAND_X1 = 555, ISLAND_HALF_Z = 15;
const islandTop = new THREE.Mesh(
  new THREE.BoxGeometry(ISLAND_X1 - ISLAND_X0, 0.5, ISLAND_HALF_Z * 2),
  cel(PAL.island, { bands: 3, tint: 0x726a54 })
);
islandTop.position.set((ISLAND_X0 + ISLAND_X1) / 2, 0.28, RIVER_Z);
islandTop.receiveShadow = true;
world.add(islandTop);
const islandWall = new THREE.Mesh(
  new THREE.BoxGeometry(ISLAND_X1 - ISLAND_X0 + 0.6, 1.6, ISLAND_HALF_Z * 2 + 0.6),
  cel(PAL.islandWall, { bands: 3 })
);
islandWall.position.set((ISLAND_X0 + ISLAND_X1) / 2, -0.55, RIVER_Z);
world.add(islandWall);

const notreDame = buildNotreDame();
notreDame.group.rotation.y = Math.PI / 2;
notreDame.group.position.set(ISLAND_X0 + 16, 0.53, RIVER_Z);
world.add(notreDame.group);
const spireShell = hullOutline(notreDame.spire, 0.055, PAL.ink);

// two river crossings framing the island, clear of its footprint
quayBridge(ISLAND_X0 - 12, 6);
quayBridge(ISLAND_X1 + 12, 6);

// a little riverside greenery on the island's east tip (the square behind the apse)
tree(ISLAND_X1 - 8, RIVER_Z - 7, 0.85);
tree(ISLAND_X1 - 8, RIVER_Z + 7, 0.85);
tree(ISLAND_X0 + 6, RIVER_Z - 9, 0.8);
tree(ISLAND_X0 + 6, RIVER_Z + 9, 0.8);

/* ============================================================== *
 *  Post pipeline
 * ============================================================== */
const pipeline = new Pipeline(renderer, scene, camera, {
  inkColor: PAL.ink,
  shadowTint: 0xa89a8a,
  lightTint: 0xfff2d8,
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  pipeline.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================== *
 *  UI
 * ============================================================== */
const state = { outline: true, beacon: true };
const chkInk = document.getElementById('chkInk');
const chkGrade = document.getElementById('chkGrade');
const chkOutline = document.getElementById('chkOutline');
const chkBeacon = document.getElementById('chkBeacon');
function setOutline(on) {
  state.outline = on;
  towerSpireShell.visible = deck1Shell.visible = deck2Shell.visible = spireShell.visible = on;
}
chkInk.addEventListener('change', () => pipeline.enabled.ink = chkInk.checked);
chkGrade.addEventListener('change', () => pipeline.enabled.grade = chkGrade.checked);
chkOutline.addEventListener('change', () => setOutline(chkOutline.checked));
chkBeacon.addEventListener('change', () => state.beacon = chkBeacon.checked);

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyO') { pipeline.enabled.ink = !pipeline.enabled.ink; chkInk.checked = pipeline.enabled.ink; }
  if (e.code === 'KeyG') { pipeline.enabled.grade = !pipeline.enabled.grade; chkGrade.checked = pipeline.enabled.grade; }
  if (e.code === 'KeyH') { setOutline(!state.outline); chkOutline.checked = state.outline; }
});

const clock = new THREE.Clock();
let t = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  t += dt;
  if (state.beacon) {
    const pulse = 0.55 + 0.45 * Math.sin(t * 3.2);
    tower.beacon.material.color.setHex(PAL.beacon).multiplyScalar(0.6 + pulse * 0.6);
    tower.beaconLight.intensity = 0.5 + pulse * 1.4;
  } else {
    tower.beaconLight.intensity = 0.7;
  }
  for (const b of boats) {
    b.mesh.position.x += b.dir * b.speed * dt;
    if (b.mesh.position.x > RIVER_X1 - 30) b.mesh.position.x = RIVER_X0 + 30;
    if (b.mesh.position.x < RIVER_X0 + 30) b.mesh.position.x = RIVER_X1 - 30;
  }
  controls.update();
  pipeline.render();
  requestAnimationFrame(frame);
}
frame();

// expose a little for tuning from the console, same convention sakura-crossing uses
window.__scene = { scene, camera, controls, pipeline, tower, boats, THREE };
</script>
</body>
</html>
